<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Synthetic collaborative-reasoning metrics</title>
<desc id="desc">Synthetic demonstration values for mean adjacent-turn uptake, participation balance, reasoning move rate, evidence request rate, and challenge rate.</desc>
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="60" y="78" font-family="Arial" font-size="38" font-weight="700" fill="#0f172a">Synthetic collaborative-reasoning metrics</text>
<text x="60" y="116" font-family="Arial" font-size="20" fill="#64748b">Bundled synthetic dialogue · descriptive output only</text>
<g font-family="Arial">
<rect x="45" y="180" width="210" height="210" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="225" font-size="17" fill="#475569">Mean uptake</text><text x="70" y="315" font-size="50" font-weight="700" fill="#0f172a">0.231</text>
<rect x="275" y="180" width="210" height="210" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="300" y="225" font-size="17" fill="#475569">Participation balance</text><text x="300" y="315" font-size="50" font-weight="700" fill="#0f172a">0.995</text>
<rect x="505" y="180" width="210" height="210" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="530" y="225" font-size="17" fill="#475569">Reasoning rate</text><text x="530" y="315" font-size="50" font-weight="700" fill="#0f172a">0.172</text>
<rect x="735" y="180" width="210" height="210" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="760" y="225" font-size="17" fill="#475569">Evidence request</text><text x="760" y="315" font-size="50" font-weight="700" fill="#0f172a">0.450</text>
<rect x="965" y="180" width="190" height="210" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="990" y="225" font-size="17" fill="#475569">Challenge rate</text><text x="990" y="315" font-size="50" font-weight="700" fill="#0f172a">0.183</text>
</g>
<rect x="145" y="470" width="910" height="105" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="600" y="515" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#0f172a">Synthetic descriptive demonstration</text>
<text x="600" y="548" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">No sequence analysis or evidence about real learner collaboration is claimed.</text>
</svg>